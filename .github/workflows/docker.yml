name: docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: strong-crane:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: check the image
        run: |
          docker run --rm strong-crane:test python -c "import catboost, lightgbm, pandas, yaml, nbclient, taxiout.run, v77.stages, v77.final_compose; print('imports ok')"
          docker run --rm strong-crane:test make help
          docker run --rm strong-crane:test python src/v77/make_notebook.py
      - name: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/somnathab3/strong-crane:latest
            ghcr.io/somnathab3/strong-crane:${{ github.sha }}
          cache-from: type=gha
