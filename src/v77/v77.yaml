# v77: the V7f4 pipeline behind v117, step by step. Read by v77/stages.py and the notebook v77/v77_pipeline.ipynb.
# Everything a run needs (inputs, settings) and everything it is checked against (reference results) is in this file.

name: v77
description: >
  Standalone build of the V7f4 pipeline from the raw organiser files to the submission, stage by stage, plus the
  LOBT window (a data property). No blending with other submissions, no copied rows, no score-fitted weights, no
  non-open data layer. The stages that v111 / v117 added on top of this core are listed under excluded_steps.
  The notebook trains everything (SMOKE = False); the pinned feature table reproduces the reference run, the build mode
  rebuilds the table from the raw inputs first.

inputs:
  # features_mode:
  #   pinned  read the fixed feature table the V7f4 run read (features_file below) - the reproduction path
  #   build   build the table from the raw inputs with taxiout.run.load_features() (stage 1 from zero: organiser files,
  #           ADS-B stand clocks, METAR, Open-Meteo, EUROCONTROL daily / monthly, ATFM, the extra inputs in data/extra).
  #           The result is cached under out/cache/features_<hash>.parquet. Its hash differs from the pinned file because
  #           the extra-inputs directory gained files after the pinned table was built, so stage results differ slightly.
  features_mode: pinned
  features_file: data/features/features_f391f7893a3cde99.parquet
  features_bytes: 615319694
  features_sha256: fcb6de88b34bbbdc33a17178c60fc899844d70faa6986dc42004f04160462e4a
  verify_sha256: true            # ~3 s; set false to skip
  # raw inputs (locations in configs/paths.json; configs/paths.example.json documents each). The ADS-B-derived inputs
  # (adsb_clocks, data/extra) are precomputed from the adsb.lol trace archive by the taxiout pipeline and
  # taxiout.build_extra; the raw traces (3-4 GB a day) are not kept on disk.
  raw:
    organiser: training_2025-*.parquet (12 months) + ranking.parquet + submitting.parquet
    adsb_clocks: clock_<day>.parquet, one per day (stand clock, pushback signature, first point) - adsb.lol, ODbL
    metar: hourly METAR per airport (NOAA / Iowa State archive)
    open_meteo: open_meteo_hourly.parquet
    eurocontrol: daily airport traffic / ATFM / taxi tables and monthly statistics (EUROCONTROL open data)
    atfm: airport_arrival_atfm_delay.parquet
    extra: taxi_<day>.parquet, stops/, stops2/, opdi_events.parquet, opdi_types.parquet, inbound.parquet, hotspots*.parquet
  # the reference run's artefacts (reports, holdout predictions, submission) for the machine comparison of every stage
  reference_run: data/reference_v7f4
  # our own earlier submission files (not included in this repository; compared against only when present)
  submissions_dir: data/submissions
  # organiser raw files (for the LOBT window and the 2025 property check): taxiout.config.paths()["organiser"]

# Settings exactly as the V7f4 run passed them to taxiout.run (everything else is the Settings default):
#   --drop context,inbound,eu_monthly,seasonal,om_drift --family-airports "hotspots=EDDF,EHAM,LEBL;hotspots2=EDDF,EHAM,LEBL"
#   --months 7 --set main_seeds=4 --set nb_skip_airports=LIRF --verbose 0 --tag v7f4
settings:
  holdout_months: [7]
  drop: [context, inbound, eu_monthly, seasonal, om_drift]
  family_airports:
    hotspots: [EDDF, EHAM, LEBL]
    hotspots2: [EDDF, EHAM, LEBL]
  main_seeds: 4
  nb_skip_airports: LIRF
  verbose: 0
  device: GPU                    # CPU gives byte-reproducible fits (slower)

# v77 hedge options for the Rome stage (taxiout/lirf_regime.py), both OFF above so the reference reproduces exactly.
# Measured by refitting the stage on the development months and applying it to the held-out month on V7f4's own
# pre-stage predictions (July and January 2025; scripts r40 / r41 of the rome_stamp study). Enable by adding them to
# `settings:` (or V77_HEDGE=1 in the notebook / `--hedge` in run_notebook.py).
hedge_options:
  lirf_regime_weighted: true       # classifier rows weighted by (gap - ordinary)^2: July 259.91 -> 258.27, January 326.24 -> 326.05
  lirf_dayshift_ev: true           # expected value over day-shift / stamped / ordinary from 14 h on, crossing local midnight:
                                   #   July 259.91 -> 255.36, January 326.24 -> 322.78 (both rest on a handful of day-shift rows)
  # both together: July ~253, January ~322.7 (whole-holdout RMSE); Rome no-NM population 3,349 -> ~3,000 s in July
  # rejected after the same test: calibration on squared taxi error (neutral), blend weight per gap band (July only)

# Smoke run: the same code path on a share of the days with small models, to check the chain runs from stage 1 to the
# final file. Its numbers are not comparable with the reference.
smoke:
  settings:
    sample_days: 0.05
    trees: 150
    gate_trees: 100
    lgb_trees: 100
    spec_trees: 100
    expert_trees: 100
    main_seeds: 1
    regime_seeds: 1
    spec_seeds: 1
    lirf_regime_seeds: 1

lobt_window:
  half_width_s: 3606             # |BLOCK - LOBT| <= 3606 s in all 2,062,577 departures of 2025 with a LOBT (0 exceptions)
  note: >
    the label lies in [MVT - LOBT - 3606, MVT - LOBT + 3606]; predictions outside are moved to the nearest edge.
    v111 -> v117 moved 49 ranking rows (official 227.5058 -> 227.1727). Idea re-measured on our data after the
    published repository EnioAguiar/prc-taxiout-2026.

